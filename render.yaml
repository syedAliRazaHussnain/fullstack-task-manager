# Render Blueprint for the API (free web service). The database lives on Neon.
services:
  - type: web
    name: task-manager-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev: TypeScript is a devDependency and is needed to build.
    buildCommand: npm ci --include=dev && npm run build
    # The migration is idempotent (CREATE TABLE IF NOT EXISTS), so it's safe on every start.
    startCommand: npm run db:migrate:prod && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # set in the Render dashboard (Neon connection string)
      - key: CORS_ORIGIN
        sync: false # set in the Render dashboard (the Vercel URL)
